name: main-guard

# Free プランの Private リポジトリではブランチ保護が使えないため、その代わりの「検出」。
# main への push が、マージ済み PR 経由でない場合（直接 push）に失敗させて目立たせる。
# 防止はできない。運用ルール(CONTRIBUTING.md)と組み合わせて使う。
on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: main-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the pushed commit came from a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # 初回 push（README だけの Initial commit 等）は対象外
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "first push to main; skip"; exit 0
          fi
          # マージ直後は commits/{sha}/pulls API への反映が数秒遅れることがあるため、
          # 0件なら10秒待って最大3回やり直す（誤検知で main が赤くなるのを防ぐ）
          prs=0
          for attempt in 1 2 3; do
            prs=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length') || prs=0
            case "$prs" in ''|*[!0-9]*) prs=0 ;; esac
            if [ "$prs" -ge 1 ]; then break; fi
            if [ "$attempt" -lt 3 ]; then
              echo "attempt $attempt: no merged PR found yet; retry in 10s"
              sleep 10
            fi
          done
          if [ "$prs" -ge 1 ]; then
            echo "OK: $SHA is from a merged PR"
          else
            echo "::error::$SHA was pushed to main without a merged PR. Report to rei/haruto."
            exit 1
          fi
