name: xbrowser-defeat-heading

# LD#126: 敗北リザルト見出しを 844x390 で Chromium / Firefox / WebKit 確認する。既存 ci.yml とは独立。
on:
  pull_request:
    paths:
      - ".github/workflows/xbrowser-defeat-heading.yml"
      - "playwright.xb.config.ts"
      - "e2e-xb/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  defeat-heading:
    name: defeat-heading (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers (retry)
        timeout-minutes: 10
        run: |
          for delay in 10 30; do
            npx playwright install --with-deps ${{ matrix.browser }} && exit 0
            echo "playwright install failed; retrying in ${delay}s"
            sleep "$delay"
          done
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - name: Run (${{ matrix.browser }})
        run: npx playwright test -c playwright.xb.config.ts --project=${{ matrix.browser }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xb-defeat-${{ matrix.browser }}
          path: xb-results/
          retention-days: 14
