name: Nightly

# PR の CI では回さない。毎晩(JST 03:xx)と手動実行だけ。
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "BOT の本数(既定 1000)"
        required: false
        default: "1000"

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bot-1000:
    name: bot-1000
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_BOT_SEEDS: ${{ inputs.seeds || '1000' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: BOT ${{ env.QA_BOT_SEEDS }} 本
        # shell: bash を明示すると -eo pipefail になり、tee 越しでも vitest の失敗でステップが落ちる
        shell: bash
        run: |
          mkdir -p nightly-report
          npx vitest run tests/qa/ 2>&1 | tee nightly-report/vitest.log
      - name: 失敗時の seed と Replay JSON を残す
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bot-1000-failure
          path: nightly-report/
          retention-days: 14
